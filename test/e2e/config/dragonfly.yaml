manager:
  enable: true
  image:
    repository: dragonflyoss/manager
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: '0'
      memory: '0'
    limits:
      cpu: '1'
      memory: '2Gi'
  metrics:
    enable: true

scheduler:
  image:
    repository: dragonflyoss/scheduler
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: '0'
      memory: '0'
    limits:
      cpu: '2'
      memory: '4Gi'
  metrics:
    enable: true

seedClient:
  image:
    repository: dragonflyoss/client
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: '0'
      memory: '0'
    limits:
      cpu: '2'
      memory: '4Gi'
  metrics:
    enable: true

client:
  image:
    repository: dragonflyoss/client
    tag: latest
  resources:
    requests:
      cpu: '0'
      memory: '0'
    limits:
      cpu: '2'
      memory: '4Gi'
  metrics:
    enable: true
  dfinit:
    enable: true
    image:
      repository: dragonflyoss/dfinit
      tag: latest
    config:
      containerRuntime:
        containerd:
          configPath: /etc/containerd/config.toml
          registries:
            - hostNamespace: docker.io
              serverAddr: https://index.docker.io
              capabilities: ['pull', 'resolve']

mysql:
  enable: true

redis:
  enable: true
